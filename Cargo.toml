[workspace]
resolver = "3"
members = ["crates/omi-core", "crates/omi-import", "crates/omi-mcp"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Explobot"]
rust-version = "1.99"

[workspace.dependencies]
omi-core = { path = "crates/omi-core" }
rusqlite = { version = "0.41.0", features = ["bundled"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
chrono = "0.4.45"
zip = "9.1.0"
quick-xml = "0.42.0"
glob = "0.3.4"
tokio = "1.54.1"
axum = "0.8.9"
rmcp = "3.7.0"
schemars = "1.2.3"
tower-http = "0.7.1"
socket2 = "0.6.5"
tokio-util = "0.7.20"
ryu = "1.0.23"
windows-service = "0.8.1"
windows-sys = "0.61.2"
# Solo per i test
assert_cmd = "2.2.2"
tempfile = "3.27.0"
reqwest = { version = "0.13.5", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
# panic resta "unwind": il servizio deve poter registrare un panic prima di terminare.
